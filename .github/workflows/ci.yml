name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync backend dependencies
        run: uv sync --locked --group dev

      - name: Run backend tests
        run: uv run pytest

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        # TODO replace tag witg full image name and push to registry
        run: docker build -t vibeaudit-ci .
