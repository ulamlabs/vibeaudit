name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync backend dependencies
        run: uv sync --locked --group dev

      - name: Run lint
        run: uvx ruff check .

      - name: Run type checks
        run: uv run mypy audit github_app vibeaudit

      - name: Run backend tests
        run: uv run pytest

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          # priority decides steps.meta.outputs.version (fed to APP_IMAGE_TAG):
          # git tag (600) > immutable sha (200) > latest (100).
          tags: |
            type=ref,event=tag
            type=sha,format=short,priority=200
            type=raw,value=latest,enable={{is_default_branch}},priority=100

      - name: Build and push Docker image
        # Push to GHCR only on master branch; always build to catch issues early
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_IMAGE_TAG=${{ steps.meta.outputs.version }}
