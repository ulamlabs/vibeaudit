[project]
name = "vibeaudit"
version = "0.1.0"
description = "Tool for doing automated code audits"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=4.2.30",
    "django-anymail>=14.0",
    "django-environ>=0.13.0",
    "django-unfold>=0.67.0",
    "djangorestframework>=3.16.1",
    "whitenoise>=6.11.0",
    "gunicorn>=22.0.0",
    "sentry-sdk[django]>=2.0.0",
    "PyGithub>=2.0",
    "celery[redis]>=5.6.3",
    "gitpython>=3.1",
    "psycopg[binary]>=3.2",
    "deepagents>=0.6.7",
    "langchain-ollama>=1.1.0",
    "pypandoc-binary>=1.13",
    "pydantic>=2.13.4",
    "typst>=0.14.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
]
