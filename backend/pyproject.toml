[project]
name = "vibeaudit"
version = "0.1.0"
description = "Tool for doing automated code audits"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "django>=4.2.30",
    "django-anymail>=14.0",
    "django-environ>=0.13.0",
    "django-unfold>=0.67.0",
    "djangorestframework>=3.16.1",
    "whitenoise>=6.11.0",
    "gunicorn>=22.0.0",
    "sentry-sdk[django]>=2.0.0",
    "PyGithub>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
