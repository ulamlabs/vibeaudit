[project]
name = "vibeaudit"
version = "0.1.0"
description = "Tool for doing automated code audits"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=4.2.30",
    "django-anymail>=14.0",
    "django-environ>=0.13.0",
    "django-unfold>=0.67.0",
    "djangorestframework>=3.16.1",
    "django-cors-headers>=4.4.0",
    "whitenoise>=6.11.0",
    "gunicorn>=22.0.0",
    "sentry-sdk[django]>=2.0.0",
    "PyGithub>=2.0",
    "celery[redis]>=5.6.3",
    "gitpython>=3.1",
    "psycopg[binary]>=3.2",
    "deepagents>=0.6.7",
    "pydantic>=2.13.4",
    "nh3>=0.3.5",
    "markdown-it-py>=4.2.0",
    "weasyprint>=69.0",
    "beautifulsoup4>=4.15.0",
    "python-slugify>=8.0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict = false

[[tool.mypy.overrides]]
module = ["langchain.*", "langchain_core.*", "langchain_anthropic.*"]
follow_imports = "skip"

[tool.django-stubs]
django_settings_module = "vibeaudit.settings"
