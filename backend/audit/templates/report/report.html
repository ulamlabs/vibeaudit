<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Georgia, serif; font-size: 11pt; line-height: 1.6; color: #1a1a1a; margin: 0; }
  .page { padding: 2.5cm 2.5cm 2cm 2.5cm; }
  .header { border-bottom: 2px solid #333; padding-bottom: 0.5em; margin-bottom: 1.5em; }
  .header h1 { font-size: 20pt; margin: 0 0 0.2em 0; }
  .meta { font-size: 9pt; color: #555; }
  h2 { font-size: 14pt; border-bottom: 1px solid #ccc; padding-bottom: 0.2em; margin-top: 1.5em; }
  h3 { font-size: 12pt; margin-top: 1.2em; }
  code { background: #f4f4f4; padding: 0.1em 0.3em; border-radius: 3px; font-size: 9pt; font-family: "Courier New", monospace; }
  pre { background: #f4f4f4; padding: 0.8em 1em; border-left: 3px solid #ccc; font-size: 9pt; font-family: "Courier New", monospace; white-space: pre-wrap; word-break: break-word; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 10pt; }
  th, td { border: 1px solid #ccc; padding: 0.4em 0.6em; text-align: left; }
  th { background: #f0f0f0; font-weight: bold; }
  blockquote { border-left: 3px solid #ccc; margin: 0.8em 0; padding: 0.2em 1em; color: #555; }
  .footer { font-size: 8pt; color: #888; text-align: right; margin-top: 2em; border-top: 1px solid #eee; padding-top: 0.5em; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>VibeAudit Report</h1>
    <div class="meta">
      Repository: {{ run.job.repo_full_name }}<br>
      Generated: {{ generated_at|date:"Y-m-d H:i" }} UTC
    </div>
  </div>
  <div class="report-body">{{ report_html }}</div>
  <div class="footer">Generated by VibeAudit &mdash; {{ generated_at|date:"Y-m-d" }}</div>
</div>
</body>
</html>
